<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Dogany에서 사진 보기</title>
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<style>
:root{
  --ground:#0C2926; --cell:#1C3936; --sep:#3C5956; --text:#F4F1E9; --text2:#BCCAC8;
  --accent:#4ECDC4; --onaccent:#0C2926; --focus:#4ECDC4;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--ground); color:var(--text);
  font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  font-size:17px; line-height:1.55;
  padding:0 20px;
}
main{max-width:640px; margin:0 auto; padding-block:48px 56px}
h1{font-size:34px; line-height:1.2; font-weight:700; margin:0 0 4px; letter-spacing:-0.01em}
.sub{margin:0 0 32px; color:var(--text2); font-size:15px}
h2{font-size:13px; font-weight:600; color:var(--text2); margin:32px 0 8px 4px; letter-spacing:0.02em}
.card{background:var(--cell); border:1px solid var(--sep); border-radius:12px; overflow:hidden}
.row{padding:14px 16px; border-top:1px solid var(--sep)}
.row:first-child{border-top:0}
.row b{display:block; font-weight:600}
.row span{display:block; color:var(--text2); font-size:15px}
ol.steps{list-style:none; margin:0; padding:0; counter-reset:s}
ol.steps > li{counter-increment:s; position:relative; padding:14px 16px 14px 56px; border-top:1px solid var(--sep)}
ol.steps > li:first-child{border-top:0}
ol.steps > li::before{
  content:counter(s); position:absolute; left:16px; top:14px; width:26px; height:26px; border-radius:50%;
  background:var(--accent); color:var(--onaccent); font-size:14px; font-weight:700; line-height:26px; text-align:center;
}
ol.steps b{display:block; font-weight:600}
ol.steps p{margin:2px 0 0; color:var(--text2); font-size:15px}
.btn{
  display:inline-block; margin-top:12px; padding:10px 18px; border-radius:8px;
  background:var(--accent); color:var(--onaccent); font-weight:600; font-size:16px; text-decoration:none;
}
a{color:var(--accent); text-decoration:none}
a:hover{text-decoration:underline}
.btn:hover{text-decoration:none; opacity:.92}
a:focus-visible{outline:3px solid var(--focus); outline-offset:2px; border-radius:4px}
.btn:focus-visible{outline-color:var(--text)}
.note{margin:8px 4px 0; color:var(--text2); font-size:13px}
footer{margin-top:40px; padding-top:16px; border-top:1px solid var(--sep); color:var(--text2); font-size:14px}
footer p{margin:0 0 6px}
@media (max-width:420px){ h1{font-size:30px} main{padding-block:32px 40px} }
</style>
</head>
<body>
<main>
  <h1>Dogany에서 사진 보기</h1>
  <p class="sub">이 링크는 연결된 아이폰의 Dogany 앱에서 사진을 엽니다.</p>

  <div class="card">
    <div class="row">
      <b>이 페이지에는 사진이 표시되지 않습니다</b>
      <span>사진은 아이폰 밖으로 나가지 않습니다. Dogany가 설치된 아이폰에서 링크를 다시 열면 사진이 보입니다.</span>
    </div>
  </div>

  <footer>
    <p><a href="https://coolcoolk.github.io/dogany-pages/install/">설치 안내 페이지 열기</a></p>
  </footer>
</main>
<script>history.replaceState(null,'',location.pathname);</script>
</body>
</html>
